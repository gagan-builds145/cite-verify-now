<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CiteVerify 30-second product walkthrough</title>
  <desc id="desc">A preview of the CiteVerify verification workspace showing a claim, its citation, retrieved evidence and a partially supported verdict.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a2c"/>
      <stop offset="0.6" stop-color="#14233d"/>
      <stop offset="1" stop-color="#1d3553"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#f6f2e8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8cbdf2"/>
      <stop offset="1" stop-color="#2463b5"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#f8f3e7" opacity="0.13"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#050d18" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <circle cx="1380" cy="120" r="330" fill="#8cbdf2" opacity="0.08"/>
  <circle cx="160" cy="820" r="250" fill="#c08a2e" opacity="0.08"/>

  <g transform="translate(82 66)">
    <rect width="36" height="36" rx="9" fill="#f8f3e7"/>
    <path d="M18 8l7 4v24h-7z" fill="#14233d"/>
    <path d="M11 8l7 4v24h-7z" fill="#2463b5"/>
    <text x="50" y="26" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8f3e7">CiteVerify</text>
  </g>

  <g transform="translate(82 150)">
    <rect x="0" y="0" width="236" height="34" rx="17" fill="#8cbdf2" opacity="0.14"/>
    <text x="18" y="23" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#8cbdf2">30-SECOND WALKTHROUGH</text>

    <text x="0" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" fill="#f8f3e7">Verify Research.</text>
    <text x="0" y="184" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-style="italic" fill="#8cbdf2">Trace Evidence.</text>

    <text x="0" y="240" font-family="Inter, Arial, sans-serif" font-size="20" fill="#f8f3e7" opacity="0.64">From PDF to a transparent, evidence-backed report.</text>

    <g transform="translate(0 286)">
      <rect width="590" height="52" rx="14" fill="#0b1729" stroke="#f8f3e7" stroke-opacity="0.12"/>
      <circle cx="27" cy="26" r="8" fill="none" stroke="#8cbdf2" stroke-width="2"/>
      <path d="M33 32l7 7" stroke="#8cbdf2" stroke-width="2" stroke-linecap="round"/>
      <text x="50" y="32" font-family="Inter, Arial, sans-serif" font-size="15" fill="#f8f3e7" opacity="0.54">Ask about papers, citations or claims…</text>
      <rect x="494" y="7" width="88" height="38" rx="10" fill="#8cbdf2"/>
      <text x="538" y="31" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0e1929">Search</text>
    </g>

    <g transform="translate(0 370)" font-family="Inter, Arial, sans-serif" font-size="13" fill="#f8f3e7">
      <circle cx="6" cy="6" r="6" fill="#7ec9a5"/>
      <text x="22" y="11" opacity="0.66">Claim extracted</text>
      <circle cx="202" cy="6" r="6" fill="#e5bd6d"/>
      <text x="218" y="11" opacity="0.66">Evidence retrieved</text>
      <circle cx="430" cy="6" r="6" fill="#8cbdf2"/>
      <text x="446" y="11" opacity="0.66">Verdict explained</text>
    </g>
  </g>

  <g transform="translate(760 96)" filter="url(#shadow)">
    <rect width="748" height="710" rx="26" fill="url(#paper)"/>
    <rect width="748" height="64" rx="26" fill="#14233d"/>
    <rect y="38" width="748" height="26" fill="#14233d"/>
    <circle cx="30" cy="32" r="6" fill="#e08a84"/>
    <circle cx="51" cy="32" r="6" fill="#e5bd6d"/>
    <circle cx="72" cy="32" r="6" fill="#7ec9a5"/>
    <text x="98" y="37" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8f3e7" opacity="0.72">Claim C2 · page 2</text>
    <rect x="602" y="18" width="116" height="28" rx="14" fill="#fff0cf"/>
    <text x="660" y="37" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9a6a17">PARTIALLY SUPPORTED</text>

    <g transform="translate(34 100)">
      <rect width="680" height="142" rx="18" fill="#ffffff" stroke="#e6e3da"/>
      <text x="22" y="30" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#5f6b7a">CLAIM UNDER REVIEW</text>
      <text x="22" y="65" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#14233d">“Across three benchmark datasets, retrieval</text>
      <text x="22" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#14233d">augmentation increased answer accuracy by 18.4%</text>
      <text x="22" y="123" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#14233d">relative to a closed-book baseline.”</text>
    </g>

    <g transform="translate(34 266)">
      <rect width="680" height="152" rx="18" fill="#fffaf0" stroke="#e6e3da"/>
      <text x="22" y="30" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#5f6b7a">RETRIEVED EVIDENCE · ABSTRACT</text>
      <rect x="22" y="48" width="4" height="72" rx="2" fill="#c08a2e"/>
      <text x="42" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#26374f">“…our RAG models generate more specific, diverse and</text>
      <text x="42" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#26374f">factual language than a state-of-the-art parametric-only</text>
      <text x="42" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#26374f">seq2seq baseline.”</text>
      <text x="22" y="145" font-family="Inter, Arial, sans-serif" font-size="10" fill="#5f6b7a">OpenAlex abstract · 2020</text>
    </g>

    <g transform="translate(34 442)">
      <rect width="680" height="146" rx="18" fill="#f2f7fd" stroke="#d8e5f4"/>
      <text x="22" y="30" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#2463b5">WHY THIS VERDICT</text>
      <text x="22" y="62" font-family="Inter, Arial, sans-serif" font-size="15" fill="#26374f">The abstract supports improved factual grounding, but it does not</text>
      <text x="22" y="87" font-family="Inter, Arial, sans-serif" font-size="15" fill="#26374f">report an 18.4% accuracy gain or a three-dataset comparison.</text>
      <text x="22" y="112" font-family="Inter, Arial, sans-serif" font-size="15" fill="#26374f">The number is unverified, so the claim stays partially supported.</text>
      <circle cx="27" cy="132" r="4" fill="#9a6a17"/>
      <text x="40" y="136" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.4" fill="#9a6a17">FLAGGED FOR MANUAL REVIEW</text>
    </g>

    <g transform="translate(34 612)">
      <rect width="680" height="58" rx="14" fill="#14233d"/>
      <text x="22" y="24" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" fill="#8cbdf2">EVIDENCE CHAIN</text>
      <text x="22" y="44" font-family="Inter, Arial, sans-serif" font-size="12" fill="#f8f3e7" opacity="0.75">claim → citation → publication → retrieved passage → verdict</text>
      <circle cx="640" cy="29" r="14" fill="#8cbdf2" opacity="0.16"/>
      <path d="M634 29l4 4 8-9" fill="none" stroke="#8cbdf2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g transform="translate(82 806)" font-family="Inter, Arial, sans-serif">
    <text font-size="13" fill="#f8f3e7" opacity="0.42">Real interface · evidence-first reporting</text>
    <text x="1350" text-anchor="end" font-size="13" fill="#8cbdf2">citeverify.app</text>
  </g>
</svg>
